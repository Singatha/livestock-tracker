name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      POSTGRES_DB: livestock_tracker
      POSTGRES_USER: livestock
      POSTGRES_PASSWORD: livestock
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: livestock_tracker
          POSTGRES_USER: livestock
          POSTGRES_PASSWORD: livestock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livestock -d livestock_tracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Verify production security settings
        env:
          DJANGO_SECRET_KEY: ci-deployment-check-only-secret-key-with-more-than-fifty-random-characters
          DJANGO_ALLOWED_HOSTS: flockwise.example.com
          DJANGO_CORS_ALLOWED_ORIGINS: https://flockwise.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://flockwise.example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
          DJANGO_CACHE_URL: redis://127.0.0.1:6379/1
          DJANGO_NUM_PROXIES: "1"
          FRONTEND_BASE_URL: https://flockwise.example.com
        run: python manage.py check --deploy --tag security --fail-level WARNING

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production bundle
        run: npm run build

  compose:
    name: Validate deployment configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate private production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Validate cloud Compose
        run: docker compose --env-file .env.cloud.example -f docker-compose.cloud.yml config --quiet

      - name: Validate shell scripts
        run: bash -n backend/entrypoint.sh scripts/backup-production.sh scripts/restore-production.sh scripts/rehearse-restore.sh

  restore:
    name: Rehearse backup and restore
    needs: compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify database and attachment recovery
        run: ./scripts/rehearse-restore.sh

  images:
    name: Build ${{ matrix.name }} image
    needs:
      - backend
      - frontend
      - compose
      - restore
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            context: backend
          - name: web
            context: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.context }}
          target: production
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.context }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.context }}
