version: 2

updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 3
