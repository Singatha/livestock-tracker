name: flockwise

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-false}
  DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_ATTACHMENT_MAX_SIZE: ${DJANGO_ATTACHMENT_MAX_SIZE:-10485760}
  DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_ERROR_SAMPLE_RATE: ${SENTRY_ERROR_SAMPLE_RATE:-1.0}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  POSTGRES_DB: ${POSTGRES_DB:-livestock_tracker}
  POSTGRES_USER: ${POSTGRES_USER:-livestock}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  CELERY_BROKER_URL: redis://redis:6379/0
  DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/1}
  DJANGO_NUM_PROXIES: ${DJANGO_NUM_PROXIES:-1}
  DJANGO_THROTTLE_LOGIN_RATE: ${DJANGO_THROTTLE_LOGIN_RATE:-10/min}
  DJANGO_THROTTLE_SIGNUP_RATE: ${DJANGO_THROTTLE_SIGNUP_RATE:-5/hour}
  DJANGO_THROTTLE_PASSWORD_RESET_RATE: ${DJANGO_THROTTLE_PASSWORD_RESET_RATE:-5/hour}
  DJANGO_THROTTLE_PASSWORD_RESET_CONFIRM_RATE: ${DJANGO_THROTTLE_PASSWORD_RESET_CONFIRM_RATE:-10/hour}
  DJANGO_THROTTLE_FARM_INVITATION_RATE: ${DJANGO_THROTTLE_FARM_INVITATION_RATE:-20/hour}
  DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
  DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-Flockwise <noreply@localhost>}
  DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
  DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
  DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
  DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
  DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
  DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-false}
  DJANGO_EMAIL_TIMEOUT: ${DJANGO_EMAIL_TIMEOUT:-10}
  FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
  RUN_MIGRATIONS: "false"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livestock_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-livestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    logging: *default-logging
    mem_limit: 1g

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *default-logging
    mem_limit: 256m

  api:
    image: flockwise-api:local
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=3
      - --threads=2
      - --timeout=60
      - --error-logfile=-
    environment:
      <<: *backend-environment
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - attachment-data:/app/media
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    mem_limit: 768m

  worker:
    image: flockwise-api:local
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *default-logging
    mem_limit: 512m

  beat:
    image: flockwise-api:local
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    tmpfs:
      - /tmp
    logging: *default-logging
    mem_limit: 256m

  web:
    image: flockwise-web:local
    build:
      context: ./frontend
      target: production
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    mem_limit: 512m

  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    mem_limit: 256m

  maintenance:
    image: alpine:3.22
    profiles: ["tools"]
    volumes:
      - attachment-data:/data
      - ./backups:/backups

volumes:
  postgres-data:
  attachment-data:
  caddy-data:
  caddy-config:
