<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f6f5ef;color:#10281c;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #d9dfd5;border-radius:16px">
            <tr>
              <td style="padding:32px">
                <p style="margin:0 0 24px;color:#006b3c;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase">Flockwise</p>
                {% block content %}{% endblock %}
                <p style="margin:32px 0 0;padding-top:20px;border-top:1px solid #e5e7e3;color:#657269;font-size:12px;line-height:1.5">
                  This is an automated service message from Flockwise.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
