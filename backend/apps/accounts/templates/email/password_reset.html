{% extends "email/base.html" %}
{% block content %}
  <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2">Reset your password</h1>
  <p style="margin:0 0 24px;color:#435248;line-height:1.6">Use the button below to choose a new Flockwise password.</p>
  <p style="margin:0 0 24px">
    <a href="{{ reset_url }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#006b3c;color:#ffffff;font-weight:700;text-decoration:none">Reset password</a>
  </p>
  <p style="margin:0;color:#657269;font-size:14px;line-height:1.6">If you did not request this, you can ignore this email. Your password will not change.</p>
{% endblock %}
