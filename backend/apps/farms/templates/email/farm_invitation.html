{% extends "email/base.html" %}
{% block content %}
  <h1 style="margin:0 0 16px;font-size:28px;line-height:1.2">Join {{ farm_name }}</h1>
  <p style="margin:0 0 8px;color:#435248;line-height:1.6">You were invited to join <strong>{{ farm_name }}</strong> as {{ role }}.</p>
  <p style="margin:0 0 24px;color:#657269;font-size:14px">This invitation expires {{ expires_at|date:"j M Y, H:i T" }}.</p>
  <p style="margin:0 0 24px">
    <a href="{{ invitation_url }}" style="display:inline-block;padding:12px 20px;border-radius:10px;background:#006b3c;color:#ffffff;font-weight:700;text-decoration:none">Accept invitation</a>
  </p>
  <p style="margin:0;color:#657269;font-size:14px;line-height:1.6">If you were not expecting this invitation, you can ignore this email.</p>
{% endblock %}
